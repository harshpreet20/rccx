<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RRC Tournament Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --green: #166534; --green-bg: #dcfce7; --green-mid: #16a34a;
  --red: #991b1b; --red-bg: #fee2e2; --red-mid: #dc2626;
  --amber: #92400e; --amber-bg: #fef3c7; --amber-mid: #d97706;
  --blue: #1e40af; --blue-bg: #eff6ff; --blue-mid: #2563eb;
  --purple: #5b21b6; --purple-bg: #f5f3ff; --purple-mid: #7c3aed;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5; background: var(--bg); color: var(--text-primary); }
input[type="text"], input[type="number"] {
  height: 36px; border: 1px solid var(--border); border-radius: 6px;
  padding: 0 10px; width: 100%; font-size: 14px; color: var(--text-primary); background: var(--surface);
}
input:focus { outline: none; border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
input[type="range"] { width: 100%; accent-color: var(--blue-mid); }
button { cursor: pointer; }
.sticky-header {
  position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 100;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 10px;
}
.header-logo { font-size: 13px; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
.header-subtitle { display: none; }
.header-spacer { flex: 1; }
.header-tag {
  background: var(--blue-bg); color: var(--blue); border: 1px solid #bfdbfe;
  border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap;
}
.main-layout {
  margin-top: 44px; height: calc(100vh - 44px); display: flex;
}
.left-col {
  width: 37%; overflow-y: auto; border-right: 1px solid var(--border);
  padding: 16px; padding-bottom: 100px; position: relative;
}
.right-col { width: 63%; overflow-y: auto; padding: 16px; }
.left-sticky-footer {
  position: fixed; bottom: 0; left: 0; width: 37%;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 16px; display: flex; gap: 8px; z-index: 50; flex-wrap: wrap;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; margin-bottom: 12px;
}
.section-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 0 8px 0;
  cursor: pointer; user-select: none; border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.section-title {
  font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1;
}
.section-chevron {
  transition: transform 0.2s; color: var(--text-muted); font-size: 12px;
}
.section-chevron.open { transform: rotate(180deg); }
.field-row { margin-bottom: 12px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; display: block; }
.seg-btns { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg-btn {
  flex: 1; height: 34px; border: none; background: var(--surface);
  font-size: 13px; color: var(--text-secondary); transition: all 0.15s;
}
.seg-btn.active { background: var(--blue-mid); color: #fff; font-weight: 600; }
.seg-btn:not(.active):hover { background: var(--bg); }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.partner-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; margin-bottom: 8px;
}
.partner-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.partner-card-header input { flex: 1; }
.icon-btn {
  width: 32px; height: 32px; border: 1px solid var(--border);
  background: var(--surface); border-radius: 6px; display: flex;
  align-items: center; justify-content: center; color: var(--text-secondary);
  font-size: 14px; padding: 0; flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg); }
.icon-btn.danger:hover { background: var(--red-bg); color: var(--red-mid); border-color: var(--red-mid); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.partner-info-row { display: flex; gap: 12px; }
.partner-info-row .field-row { flex: 1; }
.partner-meta { font-size: 12px; color: var(--text-secondary); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.add-btn {
  width: 100%; height: 36px; border: 1.5px dashed var(--border-strong);
  background: transparent; border-radius: 6px; color: var(--text-secondary);
  font-size: 13px; font-weight: 500; margin-top: 4px;
}
.add-btn:hover { background: var(--bg); border-color: var(--blue-mid); color: var(--blue-mid); }
.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
.summary-row .label { color: var(--text-secondary); }
.summary-row .value { font-weight: 600; color: var(--text-primary); }
.combined-summary { border-top: 2px solid var(--border-strong); margin-top: 8px; padding-top: 8px; }
.toggle-row { display: flex; align-items: center; gap: 10px; }
.toggle {
  width: 40px; height: 22px; border-radius: 11px; border: none;
  position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
}
.toggle.on { background: var(--blue-mid); }
.toggle.off { background: var(--border-strong); }
.toggle-thumb {
  position: absolute; top: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; transition: left 0.2s;
}
.toggle.on .toggle-thumb { left: 20px; }
.toggle.off .toggle-thumb { left: 2px; }
.toggle-label { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.expand-content { margin-top: 10px; padding-left: 50px; }
.cost-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cost-row input[type="text"] { flex: 2; }
.cost-row input[type="number"] { flex: 1; min-width: 100px; }
.cost-row .cost-day-hint { font-size: 11px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; min-width: 120px; }
.cost-row.barter-managed { opacity: 0.45; pointer-events: none; }
.subsection-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; margin-top: 4px; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.metric-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
}
.metric-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-bottom: 4px; }
.metric-value { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.metric-value.green { color: var(--green-mid); }
.metric-value.red { color: var(--red-mid); }
.metric-value.blue { color: var(--blue-mid); }
.metric-value.purple { color: var(--purple-mid); }
.metric-value.amber { color: var(--amber-mid); }
.earnings-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; margin-bottom: 12px;
}
.earnings-big { font-size: 42px; font-weight: 800; margin-bottom: 4px; }
.earnings-big.green { color: var(--green-mid); }
.earnings-big.red { color: var(--red-mid); }
.earnings-big.amber { color: var(--amber-mid); }
.progress-bar-bg { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; margin: 10px 0; }
.progress-bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
.status-banner {
  border-radius: 8px; padding: 10px 14px; margin-bottom: 12px;
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
}
.status-banner.green { background: var(--green-bg); color: var(--green); border: 1px solid #86efac; }
.status-banner.amber { background: var(--amber-bg); color: var(--amber); border: 1px solid #fcd34d; }
.status-banner.red { background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.chart-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
.chart-wrap { position: relative; height: 180px; }
.table-wrap { overflow-x: auto; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--bg); text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
tr:last-child td { border-bottom: none; }
tr.highlight td { background: #fefce8; font-weight: 600; }
.tables-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; margin-top: 16px; }
.section-label:first-child { margin-top: 0; }
.dl-btn {
  height: 40px; border: 1.5px solid; background: transparent;
  border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; padding: 0 14px;
}
.dl-btn.blue { border-color: var(--blue-mid); color: var(--blue-mid); }
.dl-btn.blue:hover { background: var(--blue-bg); }
.dl-btn.green { border-color: var(--green-mid); color: var(--green-mid); }
.dl-btn.green:hover { background: var(--green-bg); }
.dl-btn.purple { border-color: var(--purple-mid); color: var(--purple-mid); }
.dl-btn.purple:hover { background: var(--purple-bg); }
.dl-btn.amber { border-color: var(--amber-mid); color: var(--amber-mid); }
.dl-btn.amber:hover { background: var(--amber-bg); }
.dl-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: fit-content; }
.stepper-btn { width: 32px; height: 34px; border: none; background: var(--surface); font-size: 16px; color: var(--text-primary); }
.stepper-btn:hover { background: var(--bg); }
.stepper-val { width: 40px; height: 34px; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--surface); text-align: center; font-size: 14px; font-weight: 600; }
.prize-dist-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.prize-dist-row:last-child { border-bottom: none; }
.tds-warning { background: var(--amber-bg); border: 1px solid #fcd34d; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: var(--amber); margin-top: 8px; }
.red-warn { font-size: 12px; color: var(--red-mid); margin-top: 4px; }
.inline-name-edit { display: flex; align-items: center; gap: 6px; }
.inline-name-edit input { height: 28px; font-size: 13px; }
.divider { height: 1px; background: var(--border); margin: 10px 0; }
.right-section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; margin-top: 16px; }
.right-section-title:first-child { margin-top: 0; }
.variance-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
.variance-row .lbl { color: var(--text-secondary); }
.variance-row .val { font-weight: 600; }
.event-name-edit { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 340px; }
.event-name-edit input { height: 32px; font-size: 14px; font-weight: 600; }
.field-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
.mobile-tab-bar {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  background: var(--surface); border-top: 1px solid var(--border);
  z-index: 100; align-items: stretch;
}
.mobile-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; border: none; background: transparent;
  font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer;
}
.mobile-tab.active { color: var(--blue-mid); border-top: 2px solid var(--blue-mid); }
.mobile-tab-icon { font-size: 18px; }

/* Franchise cards */
.franchise-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; margin-bottom: 12px;
}
.franchise-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.franchise-partner-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.franchise-revenue { font-size: 20px; font-weight: 800; color: var(--blue-mid); }
.franchise-tier-badge {
  display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700;
  margin-left: 8px;
}
.franchise-tier-badge.brand { background: var(--blue-bg); color: var(--blue); }
.franchise-tier-badge.community { background: var(--green-bg); color: var(--green); }
.commitment-bar-bg { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.commitment-bar-fill { height: 100%; border-radius: 4px; background: var(--green-mid); transition: width 0.3s; }
.franchise-mini-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 10px 0; }
.franchise-mini-table th { background: var(--bg); padding: 5px 8px; text-align: left; font-size: 11px; color: var(--text-secondary); font-weight: 600; }
.franchise-mini-table td { padding: 5px 8px; border-top: 1px solid var(--border); }
.cost-per-player-big { font-size: 28px; font-weight: 800; color: var(--text-primary); }
.value-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-left: 8px; }
.value-badge.value { background: var(--green-bg); color: var(--green); }
.value-badge.premium { background: var(--amber-bg); color: var(--amber); }

/* Bracket CSS */
.bracket-tree { display: flex; gap: 0; overflow-x: auto; padding: 16px 0; }
.bracket-round { display: flex; flex-direction: column; justify-content: space-around; min-width: 150px; padding: 0 8px; }
.bracket-round-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; text-align: center; margin-bottom: 12px; }
.bracket-match { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin: 4px 0; font-size: 12px; position: relative; }
.bracket-match.my-match { border-color: var(--blue-mid); background: var(--blue-bg); }
.bracket-match.won { border-color: var(--green-mid); background: var(--green-bg); }
.bracket-team { padding: 3px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.bracket-team:last-child { border-bottom: none; }
.bracket-team.winner { font-weight: 700; color: var(--green-mid); }
.bracket-connector { width: 16px; border-top: 2px solid var(--border); align-self: center; }
/* FO App */
.fo-header { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; gap: 10px; }
.fo-body { margin-top: 44px; padding: 16px; padding-bottom: 80px; max-width: 600px; margin-left: auto; margin-right: auto; }
.fo-tab-bar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: var(--surface); border-top: 1px solid var(--border); z-index: 100; }
.fo-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: transparent; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.fo-tab.active { color: var(--blue-mid); border-top: 2px solid var(--blue-mid); }
.fo-tab-icon { font-size: 18px; }
.pair-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.pair-card-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--text-primary); }
.player-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.player-row input { flex: 1; }
.player-committed-btn { height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.player-committed-btn.on { background: var(--green-bg); color: var(--green); border-color: var(--green-mid); }
.reg-pending-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
/* Organizer league tab */
.league-section { margin-bottom: 20px; }
.league-section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

/* Schedule predictor */
.schedule-section { }
.day-timeline { display: flex; height: 64px; border-radius: 8px; overflow: hidden; margin: 12px 0; }
.timeline-block { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 4px 2px; overflow: hidden; min-width: 0; }
.timeline-phase { font-size: 10px; font-weight: 700; color: #fff; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.timeline-time { font-size: 9px; color: rgba(255,255,255,0.8); white-space: nowrap; }
.schedule-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.schedule-stat { background: var(--bg); border-radius: 8px; padding: 10px; text-align: center; }
.schedule-stat-val { font-size: 20px; font-weight: 800; color: var(--blue-mid); }
.schedule-stat-lbl { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
.schedule-court-table { font-size: 12px; }
.schedule-court-table th, .schedule-court-table td { padding: 6px 8px; }
.schedule-court-table td { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recommendation-list { list-style: none; margin: 8px 0; }
.recommendation-list li { padding: 6px 0; font-size: 13px; color: var(--text-primary); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-start; }
.recommendation-list li::before { content: ""; color: var(--green-mid); flex-shrink: 0; margin-top: 2px; }
.generate-btn {
  width: 100%; height: 48px; background: var(--blue-mid); color: #fff;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin: 12px 0;
}
.generate-btn:hover { background: var(--blue); }
.generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
@media (max-width: 768px) {
  .schedule-stats-grid { grid-template-columns: repeat(2, 1fr); }
  .schedule-court-table th:nth-child(4),
  .schedule-court-table td:nth-child(4),
  .schedule-court-table th:nth-child(5),
  .schedule-court-table td:nth-child(5) { display: none; }
}
.mobile-results-strip {
  display: none;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;
  flex-direction: row; gap: 0;
}
.mrs-item { flex: 1; text-align: center; }
.mrs-item + .mrs-item { border-left: 1px solid var(--border); }
.mrs-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
.mrs-value { font-size: 15px; font-weight: 700; margin-top: 2px; }
@media (max-width: 768px) {
  .main-layout { flex-direction: column; height: calc(100vh - 44px - 56px); overflow: hidden; }
  /* Tighten right col padding */
  .right-col { padding: 10px; }
  /* All cards get less padding */
  .card { padding: 12px; }
  /* Compress chart titles */
  .chart-title { font-size: 13px; }
  /* Tables: shrink font, allow scroll */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { font-size: 12px; min-width: 100%; }
  th, td { padding: 6px 7px; white-space: nowrap; }
  /* 2-day cost table: hide Category column */
  .cost-breakdown-table th:nth-child(2),
  .cost-breakdown-table td:nth-child(2) { display: none; }
  /* Sensitivity table: hide Brand Revenue + Total Revenue columns (keep Count, Costs, Surplus, RRC) */
  .sensitivity-table th:nth-child(2),
  .sensitivity-table td:nth-child(2),
  .sensitivity-table th:nth-child(3),
  .sensitivity-table td:nth-child(3) { display: none; }
  /* P&L summary rows: tighter */
  .variance-row { padding: 6px 0; font-size: 13px; }
  /* Download buttons: full width stacked */
  .dl-btn-row { flex-direction: column; }
  .dl-btn { width: 100%; height: 44px; text-align: center; }
  /* Revenue/cost detail tables side by side: stack */
  .tables-row { grid-template-columns: 1fr; }
  /* Metric grid */
  .metric-grid { grid-template-columns: 1fr 1fr; }
  /* Partner tables: smaller font */
  .partner-summary-table th, .partner-summary-table td { font-size: 11px; padding: 5px 6px; }
  /* Hide less-critical partner table columns on mobile */
  .partner-summary-table th:nth-child(6),
  .partner-summary-table td:nth-child(6),

// ---- HELPERS ----
function formatINR(amount) {
  if (amount === null || amount === undefined || isNaN(amount)) return "Rs 0";
  const rounded = Math.round(amount);
  const abs = Math.abs(rounded);
  const formatted = abs.toLocaleString('en-IN');
  return (rounded < 0 ? "-Rs " : "Rs ") + formatted;
}

function computeMetrics(state) {
  const { eventDays, playerFee, brandPartners, communityPartners, sponsorship,
          vendorStalls, sundowner, costs, prizePool } = state;
  const effectivePlayerFee = Math.min(playerFee, 1000);
  const totalBrandPlayers = brandPartners.reduce((s, p) => s + p.pairsPerPartner * 2, 0);
  const totalCommunityPlayers = communityPartners.reduce((s, p) => s + p.pairsPerPartner * 2, 0);
  const totalPlayers = totalBrandPlayers + totalCommunityPlayers;
  const totalBrandPairs = brandPartners.reduce((s, p) => s + p.pairsPerPartner, 0);
  const totalCommunityPairs = communityPartners.reduce((s, p) => s + p.pairsPerPartner, 0);
  const playerFeeRevenue = totalPlayers * effectivePlayerFee;
  const brandPartnerRevenue = brandPartners.reduce((s, p) => s + p.fee, 0);
  const communityPartnerRevenue = communityPartners.reduce((s, p) => s + p.fee, 0);
  const paidSponsorRevenue = sponsorship.paidSponsor.enabled ? sponsorship.paidSponsor.amount : 0;
  const barterValue = (sponsorship.barterShuttle.enabled ? sponsorship.barterShuttle.value : 0)
                    + (sponsorship.barterCoffee.enabled ? sponsorship.barterCoffee.value : 0);
  const vendorRevenue = vendorStalls.count * vendorStalls.feePerStall;
  const sundDownerRevenue = sundowner.enabled
    ? (sundowner.generalAttendees * sundowner.generalTicketPrice)
      + (sundowner.vipEnabled ? sundowner.vipAttendees * sundowner.vipTicketPrice : 0)
    : 0;
  const registrationFeeRevenue = (brandPartners.length + communityPartners.length) * 5000;
  const totalRevenue = brandPartnerRevenue + communityPartnerRevenue + playerFeeRevenue
    + paidSponsorRevenue + barterValue + vendorRevenue + sundDownerRevenue + registrationFeeRevenue;
  const perDayCostSubtotal = costs.perDay.reduce((s, c) => {
    if (c.id === 'coffeeMist' && sponsorship.barterCoffee.enabled) return s;
    return s + c.amount;
  }, 0) * eventDays;
  const oneTimeCostSubtotal = costs.oneTime.reduce((s, c) => s + c.amount, 0)
    + (sponsorship.barterShuttle.enabled ? 0 : costs.shuttleWaterFallback);
  const preContingencyTotal = perDayCostSubtotal + oneTimeCostSubtotal;
  const contingencyAmount = preContingencyTotal * (costs.contingencyPct / 100);
  const totalCosts = preContingencyTotal + contingencyAmount;
  const grossSurplus = totalRevenue - totalCosts;
  const prizePoolAmount = (prizePool.enabled && grossSurplus > 0)
    ? Math.min(grossSurplus * prizePool.pct / 100, grossSurplus)
    : 0;
  const netAfterPrizes = grossSurplus - prizePoolAmount;
  const mgmtFee = costs.oneTime.find(c => c.id === 'mgmtFee')?.amount ?? 50000;
  const rrcEarnings = mgmtFee + netAfterPrizes;
  return {
    totalBrandPlayers, totalCommunityPlayers, totalPlayers,
    totalBrandPairs, totalCommunityPairs,
    playerFeeRevenue, brandPartnerRevenue, communityPartnerRevenue,
    paidSponsorRevenue, barterValue, vendorRevenue, sundDownerRevenue,
    registrationFeeRevenue,
    totalRevenue, perDayCostSubtotal, oneTimeCostSubtotal,
    preContingencyTotal, contingencyAmount, totalCosts,
    grossSurplus, prizePoolAmount, netAfterPrizes, mgmtFee, rrcEarnings,
    effectivePlayerFee,
  };
}

function computePrizeDistribution(prizePoolAmount) {
  const playerShare = prizePoolAmount * 0.50;
  const partnerShare = prizePoolAmount * 0.30;
  const floatShare = prizePoolAmount * 0.20;
  const first1 = playerShare * 0.35;
  const second1 = playerShare * 0.25;
  const third1 = playerShare * 0.15;
  const individualAwards = playerShare * 0.25;
  const mvp = individualAwards / 2;
  const newcomer = individualAwards / 2;
  const firstPartner = partnerShare * 0.40;
  const secondPartner = partnerShare * 0.35;
  const thirdPartner = partnerShare * 0.25;
  return { first1, second1, third1, mvp, newcomer, firstPartner, secondPartner, thirdPartner, floatShare };
}

// ---- COLLAPSIBLE SECTION ----
function Section({ title, count, children, renameable, onRename, defaultOpen = true }) {
  const [open, setOpen] = useState(defaultOpen);
  const [editing, setEditing] = useState(false);
  const [editVal, setEditVal] = useState(title);
  const inputRef = useRef(null);

  useEffect(() => { setEditVal(title); }, [title]);

  function handleDoubleClick(e) {
    if (!renameable) return;
    e.stopPropagation();
    setEditing(true);
    setTimeout(() => inputRef.current && inputRef.current.focus(), 10);
  }
  function commitRename() {
    setEditing(false);
    if (onRename && editVal.trim()) onRename(editVal.trim());
    else setEditVal(title);
  }
  function handleKeyDown(e) {
    if (e.key === 'Enter') commitRename();
    if (e.key === 'Escape') { setEditing(false); setEditVal(title); }
  }

  const displayTitle = count !== undefined ? `${title} (${count})` : title;

  return (
    <div style={{marginBottom: 0}}>
      <div className="section-header" onClick={() => !editing && setOpen(o => !o)}>
        {editing ? (
          <div className="inline-name-edit" onClick={e => e.stopPropagation()} style={{flex:1}}>
            <input ref={inputRef} value={editVal} onChange={e => setEditVal(e.target.value)}
              onBlur={commitRename} onKeyDown={handleKeyDown} style={{flex:1}} />
          </div>
        ) : (
          <span className="section-title" onDoubleClick={handleDoubleClick} title={renameable ? "Double-click to rename" : ""}>
            {displayTitle}
            {renameable && <span style={{fontSize:11, color:'var(--text-muted)', marginLeft:6, fontWeight:400}}>(double-click to rename)</span>}
          </span>
        )}
        <span className={`section-chevron ${open ? 'open' : ''}`}>&#9660;</span>
      </div>
      {open && <div>{children}</div>}
    </div>
  );
}

function buildEventPL(state, metrics) {
  const wb = XLSX.utils.book_new();
  const { eventDays, costs, brandPartners, communityPartners, tierLabels, eventName } = state;
  const dist = computePrizeDistribution(metrics.prizePoolAmount);

  // Sheet 1: Full P&L
  const s1 = [];
  s1.push([eventName]);
  s1.push(["Full Event Profit & Loss Statement"]);
  s1.push([]);
  s1.push(["REVENUE", "", "Amount (Rs)"]);
  s1.push([`${tierLabels.brand} Revenue`, "", metrics.brandPartnerRevenue]);
  brandPartners.forEach(p => s1.push([`  ${p.name}`, "", p.fee]));
  s1.push([`${tierLabels.community} Revenue`, "", metrics.communityPartnerRevenue]);
  communityPartners.forEach(p => s1.push([`  ${p.name}`, "", p.fee]));
  s1.push(["Player Registration Fees", `${metrics.totalPlayers} players x Rs ${metrics.effectivePlayerFee}`, metrics.playerFeeRevenue]);
  if (state.sponsorship.paidSponsor.enabled) s1.push([`Paid Sponsor - ${state.sponsorship.paidSponsor.name || "Sponsor"}`, "", metrics.paidSponsorRevenue]);
  if (state.sponsorship.barterShuttle.enabled) s1.push([`Barter - ${state.sponsorship.barterShuttle.name || "Shuttle/Water"}`, "(barter value)", metrics.barterValue > 0 ? state.sponsorship.barterShuttle.value : 0]);
  if (state.sponsorship.barterCoffee.enabled) s1.push([`Barter - ${state.sponsorship.barterCoffee.name || "Coffee"}`, "(barter value)", state.sponsorship.barterCoffee.value]);
  s1.push(["Vendor Stalls", `${state.vendorStalls.count} stalls x Rs ${state.vendorStalls.feePerStall}`, metrics.vendorRevenue]);
  if (state.sundowner.enabled) {
    s1.push(["Sundowner - General Tickets", `${state.sundowner.generalAttendees} x Rs ${state.sundowner.generalTicketPrice}`, state.sundowner.generalAttendees * state.sundowner.generalTicketPrice]);
    if (state.sundowner.vipEnabled) s1.push(["Sundowner - VIP Tickets", `${state.sundowner.vipAttendees} x Rs ${state.sundowner.vipTicketPrice}`, state.sundowner.vipAttendees * state.sundowner.vipTicketPrice]);
  }
  s1.push(["TOTAL REVENUE", "", metrics.totalRevenue]);
  s1.push([]);
  s1.push(["COSTS", "", "Amount (Rs)"]);
  s1.push(["One-Time Costs", "", ""]);
  costs.oneTime.forEach(c => s1.push([`  ${c.label}`, "", c.amount]));
  if (!state.sponsorship.barterShuttle.enabled) s1.push(["  Shuttle/Water (no barter)", "", costs.shuttleWaterFallback]);
  s1.push(["Per-Day Costs", `x${eventDays} days`, ""]);
  costs.perDay.forEach(c => {
    const isBarter = c.id === 'coffeeMist' && state.sponsorship.barterCoffee.enabled;
    s1.push([`  ${c.label}`, isBarter ? "(covered by barter)" : `x${eventDays}`, isBarter ? 0 : c.amount * eventDays]);
  });
  s1.push(["One-Time Sub-total", "", metrics.oneTimeCostSubtotal]);
  s1.push(["Per-Day Sub-total", "", metrics.perDayCostSubtotal]);
  s1.push([`Contingency (${costs.contingencyPct}%)`, "", metrics.contingencyAmount]);
  s1.push(["TOTAL COSTS", "", metrics.totalCosts]);
  s1.push([]);
  s1.push(["GROSS SURPLUS", "", metrics.grossSurplus]);
  s1.push([`Prize Pool (${state.prizePool.enabled ? state.prizePool.pct : 0}%)`, "", -metrics.prizePoolAmount]);
  s1.push(["NET AFTER PRIZES", "", metrics.netAfterPrizes]);
  s1.push(["Management Fee (included in costs)", "", metrics.mgmtFee]);
  s1.push(["RRC TOTAL EARNINGS", "", metrics.rrcEarnings]);
  s1.push([]);
  s1.push(["Target Earnings", "", state.targetEarnings]);
  s1.push(["Variance to Target", "", metrics.rrcEarnings - state.targetEarnings]);
  const ws1 = XLSX.utils.aoa_to_sheet(s1);
  ws1['!cols'] = [{wch:40},{wch:24},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws1, "Full P&L");

  // Sheet 2: 2-Day Cost Split (only if eventDays===2)
  if (eventDays === 2) {
    const s2 = [];
    s2.push(["2-DAY COST BREAKDOWN"]);
    s2.push([eventName]);
    s2.push([]);
    s2.push(["Line Item", "Category", "Day 1", "Day 2", "Total"]);
    costs.oneTime.forEach(c => s2.push([c.label, "One-Time", c.amount, 0, c.amount]));
    if (!state.sponsorship.barterShuttle.enabled) s2.push(["Shuttle/Water", "One-Time", costs.shuttleWaterFallback, 0, costs.shuttleWaterFallback]);
    costs.perDay.forEach(c => {
      const isBarter = c.id === 'coffeeMist' && state.sponsorship.barterCoffee.enabled;
      const dayAmt = isBarter ? 0 : c.amount;
      s2.push([c.label, "Per-Day", dayAmt, dayAmt, dayAmt * 2]);
    });
    s2.push(["Contingency", `${costs.contingencyPct}%`, metrics.contingencyAmount / 2, metrics.contingencyAmount / 2, metrics.contingencyAmount]);
    s2.push(["TOTAL", "", metrics.oneTimeCostSubtotal + metrics.perDayCostSubtotal / 2 + metrics.contingencyAmount / 2, metrics.perDayCostSubtotal / 2 + metrics.contingencyAmount / 2, metrics.totalCosts]);
    const ws2 = XLSX.utils.aoa_to_sheet(s2);
    ws2['!cols'] = [{wch:38},{wch:14},{wch:14},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws2, "2-Day Cost Split");
  }

  // Sheet 3: Partner P&L Detail
  const s3 = [];
  s3.push(["PARTNER P&L DETAIL"]);
  s3.push([eventName]);
  s3.push([]);

  [...brandPartners.map(p => ({...p, tier: 'brand'})), ...communityPartners.map(p => ({...p, tier: 'community'}))].forEach((p, idx) => {
    const isBrand = p.tier === 'brand';
    s3.push([`${isBrand ? tierLabels.brand : tierLabels.community}: ${p.name}`]);
    s3.push(["Partnership Fee", formatINR(p.fee)]);
    s3.push(["Pairs", p.pairsPerPartner]);
    s3.push(["Players", p.pairsPerPartner * 2]);
    s3.push(["Player Fee Credit", formatINR(p.pairsPerPartner * 2 * 1000)]);
    s3.push(["Net Investment", formatINR(p.fee - p.pairsPerPartner * 2 * 1000)]);
    if (isBrand) {
      s3.push(["Cost Per Player", formatINR((p.fee - p.pairsPerPartner * 2 * 1000) / (p.pairsPerPartner * 2))]);
      s3.push(["Cost Per Player Per Day", formatINR((p.fee - p.pairsPerPartner * 2 * 1000) / (p.pairsPerPartner * 2) / eventDays)]);
    }
    s3.push([]);
    s3.push(["Finish Scenario", "Partner Prize", "Player Prize", "Total Return", "Net After Prize"]);
    const netInv = p.fee - p.pairsPerPartner * 2 * 1000;
    s3.push(["1st Place", formatINR(dist.firstPartner), formatINR(dist.first1), formatINR(dist.firstPartner + dist.first1), formatINR(netInv - dist.firstPartner - dist.first1)]);
    s3.push(["2nd Place", formatINR(dist.secondPartner), formatINR(dist.second1), formatINR(dist.secondPartner + dist.second1), formatINR(netInv - dist.secondPartner - dist.second1)]);
    s3.push(["3rd Place", formatINR(dist.thirdPartner), formatINR(dist.third1), formatINR(dist.thirdPartner + dist.third1), formatINR(netInv - dist.thirdPartner - dist.third1)]);
    s3.push(["Eliminated", "Rs 0", "Rs 0", "Rs 0", formatINR(netInv)]);
    s3.push([]);
  });

  const ws3 = XLSX.utils.aoa_to_sheet(s3);
  ws3['!cols'] = [{wch:36},{wch:18},{wch:18},{wch:18},{wch:20}];
  XLSX.utils.book_append_sheet(wb, ws3, "Partner P&L Detail");

  // Sheet 4: Sensitivity Analysis
  const s4 = [];
  s4.push(["SENSITIVITY ANALYSIS"]);
  s4.push([eventName]);
  s4.push([]);
  s4.push(["BRAND PARTNER COUNT (Community fixed)"]);
  s4.push(["Brand Count", "Brand Revenue", "Total Revenue", "Gross Surplus", "RRC Earnings", "vs Target"]);
  for (let bc = 1; bc <= 8; bc++) {
    const mockState = {
      ...state,
      brandPartners: Array.from({length: bc}, (_, i) => ({
        id: i+1, name: `Brand ${i+1}`, fee: brandPartners[0]?.fee || 150000, pairsPerPartner: brandPartners[0]?.pairsPerPartner || 3
      }))
    };
    const m = computeMetrics(mockState);
    s4.push([bc, m.brandPartnerRevenue, m.totalRevenue, m.grossSurplus, m.rrcEarnings, m.rrcEarnings - state.targetEarnings]);
  }
  s4.push([]);
  s4.push(["COMMUNITY PARTNER COUNT (Brand fixed)"]);
  s4.push(["Community Count", "Community Revenue", "Total Revenue", "Gross Surplus", "RRC Earnings", "vs Target"]);
  for (let cc = 0; cc <= 10; cc++) {
    const mockState = {
      ...state,
      communityPartners: Array.from({length: cc}, (_, i) => ({
        id: i+1, name: `Community ${i+1}`, fee: communityPartners[0]?.fee || 40000, pairsPerPartner: communityPartners[0]?.pairsPerPartner || 1
      }))
    };
    const m = computeMetrics(mockState);
    s4.push([cc, m.communityPartnerRevenue, m.totalRevenue, m.grossSurplus, m.rrcEarnings, m.rrcEarnings - state.targetEarnings]);
  }
  const ws4 = XLSX.utils.aoa_to_sheet(s4);
  ws4['!cols'] = [{wch:20},{wch:18},{wch:16},{wch:16},{wch:16},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws4, "Sensitivity Analysis");

  const safeName = state.eventName.replace(/[^a-z0-9]/gi, '-').toLowerCase();
  XLSX.writeFile(wb, `${safeName}-event-pl.xlsx`);
}

// ---- CHART: Revenue ----
function RevenueChart({ metrics, state }) {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!window.Chart || !chartRef.current) return;
    if (chartRef.current._chartInstance) {
      chartRef.current._chartInstance.destroy();
      chartRef.current._chartInstance = null;
    }
    const labels = ['Revenue Sources'];
    const data = [
      { label: `${state.tierLabels.brand}`, data: [metrics.brandPartnerRevenue], backgroundColor: '#2563eb' },
      { label: `${state.tierLabels.community}`, data: [metrics.communityPartnerRevenue], backgroundColor: '#7c3aed' },
      { label: 'Player Fees', data: [metrics.playerFeeRevenue], backgroundColor: '#16a34a' },
      { label: 'Sponsorship', data: [metrics.paidSponsorRevenue + metrics.barterValue], backgroundColor: '#d97706' },
      { label: 'Vendors', data: [metrics.vendorRevenue], backgroundColor: '#0891b2' },
      { label: 'Sundowner', data: [metrics.sundDownerRevenue], backgroundColor: '#db2777' },
    ].filter(d => d.data[0] > 0);
    chartRef.current._chartInstance = new Chart(chartRef.current, {
      type: 'bar',
      data: { labels, datasets: data },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${formatINR(ctx.parsed.x)}` } },
        },
        scales: {
          x: { stacked: true, ticks: { callback: v => formatINR(v), font: { size: 10 } } },
          y: { stacked: true, display: false },
        },
      },
    });
    return () => { if (chartRef.current && chartRef.current._chartInstance) { chartRef.current._chartInstance.destroy(); chartRef.current._chartInstance = null; } };
  }, [metrics.totalRevenue, metrics.brandPartnerRevenue, metrics.communityPartnerRevenue, metrics.playerFeeRevenue, metrics.paidSponsorRevenue, metrics.barterValue, metrics.vendorRevenue, metrics.sundDownerRevenue]);
  return (
    <div className="chart-card">
      <div className="chart-title">Revenue Breakdown</div>
      <div className="chart-wrap"><canvas ref={chartRef} /></div>
    </div>
  );
}

  const prizes = { first: 25000, second: 15000, third: 5000 };

  const bars = [
    { label: 'Total Invested', value: investedTotal, color: 'var(--red-mid)' },
    { label: 'Net if 1st', value: Math.max(0, investedTotal - prizes.first), color: 'var(--green-mid)' },
    { label: 'Net if 2nd', value: Math.max(0, investedTotal - prizes.second), color: 'var(--amber-mid)' },

// ---- FIXTURE GENERATOR ----
function generateFixtures(state) {
  const allTeams = [
    ...state.brandPartners.map(p => ({name: p.name, type: 'brand', pairs: p.pairsPerPartner})),
    ...state.communityPartners.map(p => ({name: p.name, type: 'community', pairs: p.pairsPerPartner})),
  ];
  if (allTeams.length === 0) return null;
  const numGroups = Math.max(1, Math.ceil(allTeams.length / 4));
  const groups = Array.from({length: numGroups}, (_, i) => ({ name: `Group ${String.fromCharCode(65+i)}`, teams: [] }));
  allTeams.forEach((team, i) => groups[i % numGroups].teams.push(team));
  groups.forEach(g => {
    g.matches = [];
    for (let i = 0; i < g.teams.length; i++) {
      for (let j = i+1; j < g.teams.length; j++) {
        g.matches.push({ team1: g.teams[i].name, team2: g.teams[j].name, score1: null, score2: null, winner: null });
      }
    }
  });
  const advancers = groups.flatMap(g => g.teams.slice(0, 2).map(t => t.name));
  const knockout = { rounds: [] };
  let round = [];
  for (let i = 0; i < advancers.length; i += 2) {
    round.push({ team1: advancers[i], team2: advancers[i+1]||'TBD', score1: null, score2: null, winner: null });
  }
  while (round.length > 0) {
    const name = round.length === 1 ? 'Final' : round.length === 2 ? 'Semi-Finals' : `Quarter-Finals`;
    knockout.rounds.push({ name, matches: round });
    if (round.length <= 1) break;
    const nextRound = [];
    for (let i = 0; i < round.length; i += 2) {
      nextRound.push({ team1: 'Winner TBD', team2: 'Winner TBD', score1: null, score2: null, winner: null });
    }
    round = nextRound;
    if (round.length <= 1) {
      if (round.length === 1) knockout.rounds.push({ name: 'Final', matches: round });
      break;
    }
  }
  return { groups, knockout, generatedAt: new Date().toISOString() };
}

        .select('*, rrc_registration_payments(*)').eq('registration_paid', false).order('created_at', { ascending: false });

      setPendingFOs(data || []);

    setApprovingId(fo.id);

              <button onClick={() => approveRegistration(fo)} disabled={approvingId===fo.id}

                {approvingId===fo.id ? '...' : 'Approve'}
              </button>
            </div>
            {fo.rrc_registration_payments && fo.rrc_registration_payments[0] && (
              <div style={{fontSize:12, color:'var(--text-secondary)', background:'var(--bg)', borderRadius:4, padding:'4px 8px'}}>
                Payment ref: {fo.rrc_registration_payments[0].payment_ref || '(none provided)'}
              </div>

      </div>

      {/* Fixtures Generator */}
      <div className="league-section">
        <div className="league-section-title">Tournament Fixtures Generator</div>
        <div style={{fontSize:13, color:'var(--text-secondary)', marginBottom:10}}>
          {state.brandPartners.length + state.communityPartners.length} franchises configured. Will create {Math.max(1, Math.ceil((state.brandPartners.length + state.communityPartners.length)/4))} groups.
        </div>
        <button onClick={() => setFixturePreview(generateFixtures(state))}
          style={{height:40, padding:'0 16px', background:'var(--blue-mid)', color:'#fff', border:'none', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer', marginBottom:10}}>

        {fixturePreview && (
          <div>
            <div style={{marginBottom:10}}>
              <BracketRenderer fixtures={fixturePreview} myFranchiseName={null} />

            <button onClick={saveFixtures} disabled={savingFixtures}
              style={{height:40, padding:'0 16px', background:'var(--green-mid)', color:'#fff', border:'none', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer'}}>
              {savingFixtures ? 'Saving...' : 'Save and Publish Fixtures'}
            </button>
            {savedMsg && <span style={{marginLeft:10, fontSize:13, color:'var(--green-mid)', fontWeight:600}}>{savedMsg}</span>}
          </div>
        )}
        {savedFixtures && !fixturePreview && (
          <div>
            <div style={{fontSize:13, color:'var(--green)', background:'var(--green-bg)', padding:'8px 12px', borderRadius:6, marginBottom:10}}>
              Fixtures are published. Click Generate to create a new set.
            </div>
            <BracketRenderer fixtures={savedFixtures} myFranchiseName={null} />
          </div>
        )}
      </div>

      {/* Registration Revenue */}
      <div className="league-section">
        <div className="league-section-title">Registration Revenue</div>
        <div style={{fontSize:13, color:'var(--text-secondary)'}}>
          {state.brandPartners.length + state.communityPartners.length} franchises x Rs 5,000 = <strong style={{color:'var(--green-mid)'}}>{formatINR((state.brandPartners.length + state.communityPartners.length) * 5000)}</strong>
        </div>
        <div style={{fontSize:12, color:'var(--text-muted)', marginTop:4}}>Registration fees are included in total revenue calculations.</div>
      </div>
    </div>
  );
}

// ---- MAIN APP ----
function App() {
  const [state, setState] = useState(initialState);
  const [cloudStatus, setCloudStatus] = useState('');
  const [mobileTab, setMobileTab] = useState('setup');
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

  // Auth state

  const [userRole, setUserRole] = useState(null);
  const [franchiseProfile, setFranchiseProfile] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [authView, setAuthView] = useState('login');

  // Schedule predictor state
  const [openaiKey, setOpenaiKey] = useState(''); // kept for local fallback only
  const [scheduleInputs, setScheduleInputs] = useState({
    totalPlayers: 0,
    courts: 4,
    startTime: '08:00',
    endTime: '17:00',
    matchDuration: 30,
    recoveryEnabled: true,
    recoveryDuration: 60,
    recoveryTime: '17:00',
    partyEnabled: true,
    partyTime: '18:00',
  });
  const [scheduleLoading, setScheduleLoading] = useState(false);
  const [scheduleResult, setScheduleResult] = useState(null);
  const [scheduleError, setScheduleError] = useState('');
  const [showAllSlots, setShowAllSlots] = useState(false);

  // Auth: check session on mount
  useEffect(() => {
    async function checkSession() {
      if (!supabase) { setAuthLoading(false); return; }
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) await resolveUserRole(session.user);
      setAuthLoading(false);
      const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
        if (session?.user) {
          await resolveUserRole(session.user);
        } else {
          setAuthUser(null); setUserRole(null); setFranchiseProfile(null);
        }
      });
      return () => subscription.unsubscribe();
    }
    checkSession();
  }, []);

  async function resolveUserRole(user) {
    setAuthUser(user);
    try {
      const { data: adminRow } = await supabase.from('admin_users').select('role').eq('email', user.email).maybeSingle();
      if (adminRow?.role) { setUserRole('organizer'); return; }
      const { data: org } = await supabase.from('rrc_organizers').select('*').eq('user_id', user.id).maybeSingle();
      if (org) { setUserRole('organizer'); return; }
      const { data: fo } = await supabase.from('rrc_franchise_owners').select('*').eq('user_id', user.id).maybeSingle();
      if (fo) { setFranchiseProfile(fo); setUserRole('franchise_owner'); return; }
      setUserRole('new_user');
    } catch(err) {
      console.error('resolveUserRole error:', err);
      setUserRole('new_user');
    }
  }

  // Load from Supabase on mount (fall back to localStorage)
  useEffect(() => {
    async function loadOnMount() {
      if (supabase) {
        try {
          const { data, error } = await supabase
            .from('rrc_dashboard_configs')
            .select('config')
            .eq('config_name', 'default')
            .single();
          if (!error && data && data.config && data.config.brandPartners) {
            const cfg = data.config;
            cfg.brandPartners = cfg.brandPartners.map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
            cfg.communityPartners = cfg.communityPartners.map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
            setState(cfg);
            setCloudStatus('Loaded from cloud');
            setTimeout(() => setCloudStatus(''), 3000);
            return;
          }
        } catch(e) {}
      }
      // Fallback: localStorage
      try {
        const saved = localStorage.getItem('rrcTournamentDashboard_v3');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.brandPartners && parsed.communityPartners) {
            parsed.brandPartners = parsed.brandPartners.map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
            parsed.communityPartners = parsed.communityPartners.map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
            setState(parsed);
          }
        }
      } catch(e) {}
    }
    loadOnMount();
  }, []);

  // isMobile resize
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);


  const metrics = computeMetrics(state);
  const dist = computePrizeDistribution(metrics.prizePoolAmount);

  // sync schedule totalPlayers
  useEffect(() => {
    setScheduleInputs(prev => ({...prev, totalPlayers: metrics.totalPlayers}));
  }, [metrics.totalPlayers]);

  // Save/Load - Supabase with localStorage fallback
  const saveConfig = async () => {
    // Always save to localStorage as backup
    localStorage.setItem('rrcTournamentDashboard_v3', JSON.stringify(state));
    if (supabase) {
      try {
        setCloudStatus('Saving...');
        const { error } = await supabase
          .from('rrc_dashboard_configs')
          .upsert({ config_name: 'default', config: state }, { onConflict: 'config_name' });
        if (error) throw error;
        setCloudStatus('Saved to cloud');
        setTimeout(() => setCloudStatus(''), 3000);
      } catch(e) {
        setCloudStatus('Saved locally (cloud error)');
        setTimeout(() => setCloudStatus(''), 4000);
      }
    } else {
      setCloudStatus('Saved to browser');
      setTimeout(() => setCloudStatus(''), 3000);
    }
  };

  const loadConfig = async () => {
    if (!window.confirm('Load saved configuration? Current changes will be lost.')) return;
    if (supabase) {
      try {
        setCloudStatus('Loading...');
        const { data, error } = await supabase
          .from('rrc_dashboard_configs')
          .select('config')
          .eq('config_name', 'default')
          .single();
        if (!error && data && data.config && data.config.brandPartners) {
          const cfg2 = data.config;
          cfg2.brandPartners = cfg2.brandPartners.map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
          cfg2.communityPartners = cfg2.communityPartners.map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
          setState(cfg2);
          setCloudStatus('Loaded from cloud');
          setTimeout(() => setCloudStatus(''), 3000);
          return;
        }
      } catch(e) {}
    }
    // Fallback: localStorage
    const saved = localStorage.getItem('rrcTournamentDashboard_v3');
    if (saved) {
      try {
        const p2 = JSON.parse(saved);
        p2.brandPartners = (p2.brandPartners || []).map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
        p2.communityPartners = (p2.communityPartners || []).map(p => ({...p, confirmedPlayers: p.confirmedPlayers ?? p.pairsPerPartner * 2}));
        setState(p2); setCloudStatus('Loaded from browser'); setTimeout(() => setCloudStatus(''), 3000);
      }
      catch(e) { alert('Could not load config'); }
    } else { alert('No saved config found'); }
  };
  const exportJSON = () => {
    const d = new Date().toISOString().slice(0,10);

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rrc-config-${d}.json`;
    a.click();
  };
  const importRef = useRef(null);
  const importJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.brandPartners || !parsed.communityPartners) throw new Error('Invalid');
        setState(parsed);
        alert('Configuration imported successfully!');
      } catch(err) { alert('Invalid config file. Please use an exported config file.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // State helpers
  const upd = (path, val) => {
    setState(prev => {
      const keys = path.split('.');
      const next = JSON.parse(JSON.stringify(prev));
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      obj[keys[keys.length - 1]] = val;
      return next;
    });
  };

  const updBrandPartner = (id, newP) => setState(prev => ({
    ...prev, brandPartners: prev.brandPartners.map(p => {
      if (p.id !== id) return p;
      const maxPlayers = newP.pairsPerPartner * 2;
      const confirmedPlayers = Math.min(newP.confirmedPlayers ?? maxPlayers, maxPlayers);
      return {...newP, confirmedPlayers};
    })
  }));
  const addBrandPartner = () => setState(prev => ({
    ...prev, brandPartners: [...prev.brandPartners, {
      id: newId(), name: `${prev.tierLabels.brand} ${prev.brandPartners.length + 1}`,
      fee: 150000, pairsPerPartner: 3, confirmedPlayers: 6
    }]
  }));
  const updateBrandPartnerConfirmed = (id, val) => setState(prev => ({
    ...prev, brandPartners: prev.brandPartners.map(p => {
      if (p.id !== id) return p;
      const max = p.pairsPerPartner * 2;
      return {...p, confirmedPlayers: Math.min(Math.max(0, val), max)};
    })
  }));
  const delBrandPartner = (id) => setState(prev => ({
    ...prev, brandPartners: prev.brandPartners.filter(p => p.id !== id)
  }));
  const updCommunityPartner = (id, newP) => setState(prev => ({
    ...prev, communityPartners: prev.communityPartners.map(p => {
      if (p.id !== id) return p;
      const maxPlayers = newP.pairsPerPartner * 2;
      const confirmedPlayers = Math.min(newP.confirmedPlayers ?? maxPlayers, maxPlayers);
      return {...newP, confirmedPlayers};
    })
  }));
  const addCommunityPartner = () => setState(prev => ({
    ...prev, communityPartners: [...prev.communityPartners, {

      return {...p, confirmedPlayers: Math.min(Math.max(0, val), max)};
    })
  }));
  const delCommunityPartner = (id) => setState(prev => ({
    ...prev, communityPartners: prev.communityPartners.filter(p => p.id !== id)
  }));

  const updOneTimeCost = (id, newItem) => setState(prev => ({
    ...prev, costs: { ...prev.costs, oneTime: prev.costs.oneTime.map(c => c.id === id ? newItem : c) }
  }));

    ...prev, costs: { ...prev.costs, oneTime: prev.costs.oneTime.filter(c => c.id !== id) }
  }));
  const addOneTimeCost = () => setState(prev => ({

  }));

    ...prev, costs: { ...prev.costs, perDay: prev.costs.perDay.map(c => c.id === id ? newItem : c) }
  }));
  const delPerDayCost = (id) => setState(prev => ({
    ...prev, costs: { ...prev.costs, perDay: prev.costs.perDay.filter(c => c.id !== id) }
  }));
  const addPerDayCost = () => setState(prev => ({
    ...prev, costs: { ...prev.costs, perDay: [...prev.costs.perDay, { id: `custom_${newId()}`, label: "Custom Per-Day Cost", amount: 0, deletable: true }] }
  }));

  async function generateSchedule() {
    setScheduleLoading(true);
    setScheduleError('');
    setScheduleResult(null);

    const totalPairs = Math.ceil(scheduleInputs.totalPlayers / 2);
    const [sh, sm] = scheduleInputs.startTime.split(':').map(Number);
    const [eh, em] = scheduleInputs.endTime.split(':').map(Number);
    const matchMinutes = (eh * 60 + em) - (sh * 60 + sm);
    const slotsPerCourt = Math.floor(matchMinutes / scheduleInputs.matchDuration);
    const totalSlots = slotsPerCourt * scheduleInputs.courts;

    const prompt = `You are a badminton tournament scheduling expert. Generate a complete schedule for:

Event: ${state.eventName}
Format: Doubles (pairs of 2 players)
Total players: ${scheduleInputs.totalPlayers} (${totalPairs} pairs)
Courts available: ${scheduleInputs.courts}
Match start: ${scheduleInputs.startTime}
Match end: ${scheduleInputs.endTime}
Average match duration: ${scheduleInputs.matchDuration} minutes (including changeover)
Total match slots available: ${totalSlots} across all courts

Requirements:
1. Design a tournament format (group stage + knockout bracket) that fits within the time window
2. Group stage: round-robin within groups of 4-5 pairs
3. After groups: top 2 from each group advance to knockout
4. Include a 30-minute lunch break at 1:00 PM
5. Every pair should play at minimum 3 matches guaranteed (group stage)
6. ${scheduleInputs.recoveryEnabled ? `Recovery session: ${scheduleInputs.recoveryDuration} minutes starting ${scheduleInputs.recoveryTime} with fitness trainers` : 'No recovery session'}
7. ${scheduleInputs.partyEnabled ? `Evening party/sundowner starts at ${scheduleInputs.partyTime}` : 'No evening party'}

Return a JSON object with this exact structure:
{
  "format": "string describing the format chosen",
  "totalPairs": number,
  "groups": [{"name": "Group A", "pairs": 4, "matches": 6}],
  "timeline": [
    {"time": "08:00", "court1": "Group A: Pair 1 vs Pair 2", "court2": "Group B: Pair 5 vs Pair 6", "court3": "...", "court4": "..."},
    ...more time slots...
  ],
  "knockoutBracket": {"QF": [], "SF": [], "Final": ""},
  "daySchedule": [
    {"phase": "Group Stage", "start": "08:00", "end": "12:30", "description": "Round robin within groups"},
    {"phase": "Lunch Break", "start": "12:30", "end": "13:00", "description": ""},
    {"phase": "Knockout", "start": "13:00", "end": "17:00", "description": "QF, SF, Final"},
    {"phase": "Recovery Session", "start": "17:00", "end": "18:00", "description": "Cult fitness trainers"},
    {"phase": "Sundowner Party", "start": "18:00", "end": "23:00", "description": "DJ, rain shower, food"}
  ],
  "recommendations": ["insight 1", "insight 2", "insight 3"],
  "maxPlayersForFormat": number,
  "utilizationPct": number
}`;

    try {
      const res = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [{ role: 'user', content: prompt }],
          response_format: { type: 'json_object' },
          temperature: 0.3,
        })
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || data.error);
      let schedule;
      try {
        schedule = typeof data.choices[0].message.content === 'string'
          ? JSON.parse(data.choices[0].message.content)
          : data.choices[0].message.content;
      } catch(parseErr) {
        throw new Error('Invalid schedule format returned by AI');
      }
      if (!schedule.format || !schedule.timeline || !schedule.daySchedule) {
        throw new Error('Incomplete schedule structure from AI');
      }
      setScheduleResult(schedule);
    } catch(e) {
      setScheduleError(`Failed to generate schedule: ${e.message}`);

      setScheduleLoading(false);
    }
  }

    return '#0891b2';
  }

  const progressColor = statusColor === 'green' ? 'var(--green-mid)' : statusColor === 'amber' ? 'var(--amber-mid)' : 'var(--red-mid)';

  return (
    <div>

          <input type="text" value={state.eventName}
            onChange={e => upd('eventName', e.target.value)}
            style={{fontWeight:600, fontSize:13, height:30, border:'none', background:'transparent', padding:'0 4px'}} />
        </div>
        <div className="header-spacer" />
        <span className="header-tag">{state.eventDays}-Day Event</span>

          RRC: {formatINR(metrics.rrcEarnings)}
        </span>
        {authUser && (
          <div style={{display:'flex', alignItems:'center', gap:8}}>
            <span style={{fontSize:12, color:'var(--text-secondary)', maxWidth:80, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>Organizer</span>
            <button onClick={()=>supabase.auth.signOut()} style={{height:28, padding:'0 10px', border:'1px solid var(--border)', borderRadius:6, background:'transparent', fontSize:12, cursor:'pointer', color:'var(--text-secondary)'}}>Sign Out</button>
          </div>
        )}
      </div>

      {/* MAIN LAYOUT */}
      <div className="main-layout">
        {/* LEFT COLUMN */}
        <div className={`left-col ${mobileTab==='setup'?'tab-active':''}`}>
          {/* Mobile results strip */}
          <div className="mobile-results-strip">
            <div className="mrs-item">
              <div className="mrs-label">Revenue</div>
              <div className="mrs-value blue" style={{color:'var(--blue-mid)'}}>{formatINR(metrics.totalRevenue)}</div>
            </div>
            <div className="mrs-item">

          </div>

            <Section title={state.tierLabels.brand} count={state.brandPartners.length} renameable

                <div className="summary-row"><span className="label">Total Brand Pairs</span><span className="value">{metrics.totalBrandPairs}</span></div>
              </div>
            </Section>
          </div>

                    </div>
                    <div className="field-row">
                      <label className="field-label">Sponsorship Amount (Rs)</label>
                      <input type="number" min="0" value={state.sponsorship.paidSponsor.amount} onChange={e => upd('sponsorship.paidSponsor.amount', Number(e.target.value) || 0)} />

                    <div className="field-row">
                      <label className="field-label">Description</label>

                  </div>

              </div>
              {/* Barter Shuttle */}

                      <label className="field-label">Barter Value (Rs) - covers shuttle/water cost</label>
                      <input type="number" min="0" value={state.sponsorship.barterShuttle.value} onChange={e => upd('sponsorship.barterShuttle.value', Number(e.target.value) || 0)} />

                    </div>
                    <p style={{fontSize:11, color:'var(--green-mid)'}}>Shuttle/water fallback cost (Rs {state.costs.shuttleWaterFallback.toLocaleString('en-IN')}) removed from costs when enabled.</p>

                    </div>
                    <div className="field-row">
                      <label className="field-label">Barter Value (Rs) - covers coffee/mist fans cost</label>
                      <input type="number" min="0" value={state.sponsorship.barterCoffee.value} onChange={e => upd('sponsorship.barterCoffee.value', Number(e.target.value) || 0)} />

                <div className="summary-row">
                  <span className="label">Vendor Revenue</span>
                  <span className="value" style={{color:'var(--blue-mid)'}}>{formatINR(metrics.vendorRevenue)}</span>
                </div>
              </div>
            </Section>
          </div>

                  <div className="field-row">
                    <label className="field-label">General Attendees</label>
                    <input type="number" min="0" value={state.sundowner.generalAttendees} onChange={e => upd('sundowner.generalAttendees', Number(e.target.value) || 0)} />

                  </div>

                    <Toggle on={state.sundowner.vipEnabled} onChange={v => upd('sundowner.vipEnabled', v)} />

                  </div>
                  {state.sundowner.vipEnabled && (
                    <>
                      <div className="field-row">
                        <label className="field-label">VIP Ticket Price (Rs)</label>
                        <input type="number" min="0" value={state.sundowner.vipTicketPrice} onChange={e => upd('sundowner.vipTicketPrice', Number(e.target.value) || 0)} />
                        <div className="field-hint">Premium section with better access/food</div>
                      </div>
                      <div className="field-row">
                        <label className="field-label">VIP Attendees</label>
                        <input type="number" min="0" value={state.sundowner.vipAttendees} onChange={e => upd('sundowner.vipAttendees', Number(e.target.value) || 0)} />
                        <div className="field-hint">Expected VIP section headcount</div>
                      </div>
                    </>
                  )}
                  <div className="summary-row">
                    <span className="label">Sundowner Revenue</span>
                    <span className="value" style={{color:'var(--blue-mid)'}}>{formatINR(metrics.sundDownerRevenue)}</span>
                  </div>
                </div>
              )}
            </Section>
          </div>

          {/* Section 5: Costs */}
          <div className="card" style={{marginBottom:12}}>
            <Section title="Costs">
              <div className="subsection-title">One-Time Costs</div>
              <div className="field-hint" style={{marginBottom:8}}>One-time, billed once regardless of event days</div>
              {state.costs.oneTime.map(c => (
                <CostRowItem key={c.id} item={c} eventDays={state.eventDays}
                  onChange={newItem => updOneTimeCost(c.id, newItem)}
                  onDelete={() => delOneTimeCost(c.id)}
                  barterManaged={false} showDayHint={false} />
              ))}
              {!state.sponsorship.barterShuttle.enabled && (
                <div style={{fontSize:12, color:'var(--text-secondary)', marginBottom:8, padding:'4px 0'}}>
                  + Shuttle/Water fallback: {formatINR(state.costs.shuttleWaterFallback)}
                  <input type="number" min="0" value={state.costs.shuttleWaterFallback}
                    onChange={e => setState(prev => ({...prev, costs: {...prev.costs, shuttleWaterFallback: Number(e.target.value)||0}}))}
                    style={{display:'inline-block', width:120, marginLeft:8, height:28, fontSize:12}} />
                </div>
              )}
              <button className="add-btn" onClick={addOneTimeCost} style={{marginBottom:12}}>+ Add one-time cost</button>

              <div className="divider" />
              <div className="subsection-title">Per-Day Costs (x {state.eventDays} days)</div>
              <div className="field-hint" style={{marginBottom:8}}>Multiplied by number of event days</div>

                const barterManaged = c.id === 'coffeeMist' && state.sponsorship.barterCoffee.enabled;

                  <CostRowItem key={c.id} item={c} eventDays={state.eventDays}

                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <input type="number" min="0" max="50" value={state.costs.contingencyPct}
                    onChange={e => setState(prev => ({...prev, costs: {...prev.costs, contingencyPct: Number(e.target.value)||0}}))}
                    style={{width:80}} />
                  <span style={{fontSize:13, color:'var(--text-secondary)'}}>= {formatINR(metrics.contingencyAmount)}</span>
                </div>
                <div className="field-hint">Buffer for unexpected costs - applied to total before prize pool</div>
              </div>
              <div className="summary-row" style={{marginTop:8}}>
                <span className="label" style={{fontWeight:700}}>Pre-contingency Total</span>
                <span className="value">{formatINR(metrics.preContingencyTotal)}</span>
              </div>
              <div className="summary-row">
                <span className="label" style={{fontWeight:700, color:'var(--red-mid)'}}>Total Costs (with contingency)</span>
                <span className="value" style={{color:'var(--red-mid)'}}>{formatINR(metrics.totalCosts)}</span>
              </div>

            <div style={{background:'var(--amber-bg)', borderRadius:8, padding:'10px 14px', fontSize:13, color:'var(--amber)'}}>

            </div>

                  <span className="value" style={{color:'var(--amber-mid)'}}>{formatINR(amt)}</span>
                </div>

              <div className="summary-row" style={{borderTop:'2px solid var(--border-strong)', paddingTop:8, marginTop:4}}>
                <span className="label" style={{fontWeight:700}}>Total Prize Money</span>
                <span className="value" style={{color:'var(--amber-mid)', fontWeight:700}}>Rs 45,000</span>
              </div>

                <div className={`earnings-big ${earningsClass}`}>{formatINR(metrics.rrcEarnings)}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:12, color:'var(--text-secondary)'}}>Target</div>
                <div style={{fontSize:18, fontWeight:700}}>{formatINR(state.targetEarnings)}</div>
                <div style={{fontSize:12, color: metrics.rrcEarnings >= state.targetEarnings ? 'var(--green-mid)' : 'var(--red-mid)', fontWeight:600}}>
                  {metrics.rrcEarnings >= state.targetEarnings ? '+' : ''}{formatINR(metrics.rrcEarnings - state.targetEarnings)} vs target
                </div>
              </div>
            </div>
            <div className="progress-bar-bg">
              <div className="progress-bar-fill" style={{width: `${Math.min(100, Math.max(0, pct))}%`, background: progressColor}} />
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:12, color:'var(--text-secondary)'}}>
              <span>{Math.round(pct)}% of target</span>
              <span>Mgmt fee included: {formatINR(metrics.mgmtFee)}</span>
            </div>
            <div style={{marginTop:8, padding:'8px 12px', background:'var(--bg)', borderRadius:6, fontSize:13}}>

          <div className={`status-banner ${statusColor}`}>
            <span>{statusColor === 'green' ? '✓' : statusColor === 'amber' ? '!' : 'x'}</span>

            {statusColor === 'amber' && `Approaching target - at ${Math.round(pct)}% of target. Consider adding partners or sponsorship.`}
            {statusColor === 'red' && `Below target - at ${Math.round(pct)}% of target. Significant gap to close. Review costs and revenue sources.`}

              <div className="metric-label">Total Revenue</div>
              <div className="metric-value blue">{formatINR(metrics.totalRevenue)}</div>

            <div className="metric-card">
              <div className="metric-label">Total Costs</div>
              <div className="metric-value red">{formatINR(metrics.totalCosts)}</div>
            </div>

              <div className="metric-label">Gross Surplus</div>
              <div className={`metric-value ${metrics.grossSurplus >= 0 ? 'green' : 'red'}`}>{formatINR(metrics.grossSurplus)}</div>

              <div className="metric-value amber">Rs 45,000</div>
              <div style={{fontSize:11, color:'var(--text-muted)'}}>Fixed (1st+2nd+3rd)</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Reg. Fee Revenue</div>
              <div className="metric-value green">{formatINR(metrics.registrationFeeRevenue)}</div>

            </div>
            <div className="metric-card">
              <div className="metric-label">Total Partners</div>

                    ['Registration Fees', metrics.registrationFeeRevenue],
                    ['Paid Sponsor', metrics.paidSponsorRevenue],

                    <td>TOTAL</td><td>{formatINR(metrics.totalRevenue)}</td><td>100%</td>

            <div className="card" style={{marginBottom:0}}>

                    ['One-Time Costs', metrics.oneTimeCostSubtotal],

        <button className={`mobile-tab ${mobileTab==='league'?'active':''}`} onClick={()=>setMobileTab('league')}>
          <span className="mobile-tab-icon">⚡</span>
          <span>League</span>
        </button>
      </div>

      {/* LEFT STICKY FOOTER */}
      <div className="left-sticky-footer">
        <button className="dl-btn purple" style={{height:36, fontSize:12}} onClick={saveConfig}>Save Cloud</button>
        <button className="dl-btn amber" style={{height:36, fontSize:12}} onClick={loadConfig}>Load Cloud</button>
        <button className="dl-btn blue" style={{height:36, fontSize:12}} onClick={exportJSON}>Export</button>
        <button className="dl-btn green" style={{height:36, fontSize:12}} onClick={() => importRef.current && importRef.current.click()}>Import</button>
        <div style={{flex:1}} />
        <div style={{fontSize:12, color:'var(--text-secondary)', display:'flex', alignItems:'center', gap:12}}>
          <span>Players: <strong>{metrics.totalPlayers}</strong></span>
          <span>Revenue: <strong style={{color:'var(--blue-mid)'}}>{formatINR(metrics.totalRevenue)}</strong></span>
          <span>Surplus: <strong style={{color: metrics.grossSurplus >= 0 ? 'var(--green-mid)' : 'var(--red-mid)'}}>{formatINR(metrics.grossSurplus)}</strong></span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
